<article class="project-card" [style.--card-accent]="project.accent">
  <!-- Lienzo de color: sustituye a una captura mientras no la haya. -->
  <div class="project-card__canvas" aria-hidden="true">
    <span class="project-card__initial">{{ project.name.charAt(0) }}</span>
    <span class="project-card__year">{{ project.period }}</span>
  </div>

  <div class="project-card__body">
    <h3 class="project-card__title">
      <a [routerLink]="['/projects', project.slug]">{{ project.name }}</a>
    </h3>

    <p class="project-card__meta">
      {{ project.role
      }}<ng-container *ngIf="project.company"> · {{ project.company }}</ng-container>
    </p>

    <p class="project-card__summary">{{ project.summary }}</p>

    <ul class="project-card__stack">
      <li *ngFor="let tech of project.stack" class="project-card__tech">
        {{ tech }}
      </li>
    </ul>

    <span class="project-card__cue">
      Ver caso de estudio
      <app-icon name="arrow-right" [size]="15"></app-icon>
    </span>
  </div>
</article>
